name: Auto-merge Claude content branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge pushed branch into main
        run: |
          git config user.name "SG Auto-Merge"
          git config user.email "actions@github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Auto-merge ${GITHUB_REF_NAME} into main"
          git push origin main
