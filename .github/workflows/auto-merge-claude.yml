name: Auto-merge Claude content branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.shas.outputs.before }}
      after: ${{ steps.shas.outputs.after }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge pushed branch into main
        run: |
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "SG Auto-Merge"
          git config user.email "actions@github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Auto-merge ${GITHUB_REF_NAME} into main"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # data rebuild that rebuild-data.yml does for direct pushes runs here too.
      - name: Rebuild tools.json and Price Watch
        run: |
          if [ -f scripts/build-tools-json.js ]; then
            node scripts/build-tools-json.js
            node scripts/build-price-watch.js
            node scripts/build-categories.js
            node scripts/build-pricing.js
            node scripts/build-keyword-map.js
            git add data/tools.json price-watch/index.html index.html new/index.html category pricing review sitemap.xml seo/keyword-map.json
            git diff --cached --quiet || git commit -m "Rebuild tools.json and Price Watch"
          fi

      # Gate: main is not updated if the merged site breaks a blocking SEO rule
      # (scripts/seo-check.js). The branch stays as it is; fix it and push again.
      - name: SEO check
        run: |
          if [ -f scripts/seo-check.js ]; then
            node scripts/seo-check.js --report "$RUNNER_TEMP/seo-report.md" > /dev/null || { cat "$RUNNER_TEMP/seo-report.md" >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/seo-report.md"; echo "::error::SEO check failed — main not updated. Run node scripts/seo-check.js locally."; exit 1; }
            cat "$RUNNER_TEMP/seo-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push main
        run: git push origin main

      - name: Record SHAs for IndexNow
        id: shas
        run: |
          echo "before=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Tell Bing & co. which pages changed (scripts/indexnow.js waits for the Pages deploy).
  # Runs here because pushes made with GITHUB_TOKEN don't trigger indexnow.yml.
  indexnow:
    needs: merge-to-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Announce changed pages
        run: node scripts/indexnow.js "${{ needs.merge-to-main.outputs.before }}" "${{ needs.merge-to-main.outputs.after }}"
